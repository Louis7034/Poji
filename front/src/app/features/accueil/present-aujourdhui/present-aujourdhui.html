<section class="mx-8 w-full max-w-3xl overflow-hidden rounded-2xl bg-white shadow-sm" aria-labelledby="present-title">
  <h2 id="present-title" class="px-8 py-6 text-2xl font-bold text-[#243b70]">
    Enfant présent aujourd'hui
  </h2>

  <div class="max-h-96 divide-y divide-slate-100 overflow-y-auto">
    @for (enfant of enfantPresentTodaySignal(); track enfant.enfant_id) {
      <div class="flex items-center gap-5 px-8 py-4">
        <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-[#eef3ff] text-[#526fca]" aria-hidden="true">
          <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 21c.3-3.8 2.6-6 7-6s6.7 2.2 7 6"></path>
          </svg>
        </span>

        <p class="min-w-0 flex-1 truncate text-lg font-semibold text-[#243b70]">
          {{ enfant.prenom }}
        </p>

        <span [class]="getEtatClass(enfant.etat_presence)">
          {{ getEtatLabel(enfant.etat_presence) }}
        </span>

        <span class="w-14 text-right text-lg font-semibold text-slate-400">
          {{ enfant.heure_arrivee?.substring(0, 5) ?? '--' }}
        </span>
      </div>
    } @empty {
      <p class="px-8 py-6 text-slate-500">Aucune enfant n'est enregistrée aujourd'hui.</p>
    }
  </div>
</section>
