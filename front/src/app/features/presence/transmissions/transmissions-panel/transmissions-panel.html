<section class="transmissions-page mx-4 my-4 overflow-hidden rounded-2xl border border-slate-200 bg-white sm:my-6">
  <div class="px-4 pt-4 sm:px-6 sm:pt-5">
    <app-back-button />
  </div>
  <header class="border-b border-slate-200 px-4 pt-5 sm:px-6 sm:pt-6">
    <p class="text-sm font-semibold text-slate-500">Transmissions de l'enfant</p>
    <h2 class="mt-1 text-2xl font-bold text-slate-800">
      Journal de transmission
      @if (enfantPrenom()) {
        <span class="text-2xl font-bold text-slate-800">{{ enfantPrenom() }}</span>
      }
    </h2>
    <nav class="transmission-tabs mt-5 flex gap-6 overflow-x-auto sm:mt-6" aria-label="Type de transmission">
      <button type="button" (click)="onglet.set('matin')"
        [class]="onglet() === 'matin'
          ? 'border-b-2 border-orange-500 px-1 pb-3 font-semibold text-orange-600'
          : 'border-b-2 border-transparent px-1 pb-3 text-slate-500'"
        [attr.aria-selected]="onglet() === 'matin'">
        Transmission matin
      </button>
      <button type="button" (click)="onglet.set('soir')"
        [class]="onglet() === 'soir'
          ? 'border-b-2 border-orange-500 px-1 pb-3 font-semibold text-orange-600'
          : 'border-b-2 border-transparent px-1 pb-3 text-slate-500'"
        [attr.aria-selected]="onglet() === 'soir'">
        Transmission soir
      </button>
      <button type="button" (click)="onglet.set('sante')"
        [class]="onglet() === 'sante'
          ? 'border-b-2 border-orange-500 px-1 pb-3 font-semibold text-orange-600'
          : 'border-b-2 border-transparent px-1 pb-3 text-slate-500'"
        [attr.aria-selected]="onglet() === 'sante'">
        Santé
      </button>
      <button type="button" (click)="onglet.set('sieste')"
        [class]="onglet() === 'sieste'
          ? 'border-b-2 border-orange-500 px-1 pb-3 font-semibold text-orange-600'
          : 'border-b-2 border-transparent px-1 pb-3 text-slate-500'"
        [attr.aria-selected]="onglet() === 'sieste'">
        Sieste
      </button>
    </nav>
  </header>

  <div class="transmission-content p-4 sm:p-6">
    @if (onglet() === 'matin') {
      <app-transmissions-matin [enfantId]="enfantId()" />
    } @else if (onglet() === 'soir') {
      <app-transmissions-soir [enfantId]="enfantId()" />
    } @else if (onglet() === 'sante') {
      <app-transmissions-sante [enfantId]="enfantId()" />
    } @else {
      <app-transmission-sieste [enfantId]="enfantId()" />
    }
  </div>
</section>
