<main class="flex min-h-screen items-center justify-center bg-[#f4f7fc] px-6 py-10">
  <section class="w-full max-w-md rounded-3xl bg-white p-8 shadow-xl">
    <div class="mb-8 text-center">
      <div class="poji-mark mx-auto mb-4" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M18 18v28M18 18h13.5a9 9 0 0 1 0 18H18" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="46.5" cy="19" r="3.5" fill="#FF8A70"/>
        </svg>
      </div>
      <p class="mb-1 text-sm font-bold uppercase tracking-[0.24em] text-[#526fca]">Poji</p>
      <h1 class="text-3xl font-bold text-[#243b70]">Bienvenue sur Poji</h1>
      <p class="mt-2 text-slate-500">Connectez-vous à votre espace</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-5">
      <div>
        <label for="email" class="mb-2 block text-sm font-semibold text-slate-700">Adresse e-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 outline-none transition focus:border-[#526fca] focus:ring-2 focus:ring-[#526fca]/20"
          placeholder="vous@exemple.fr"
        />
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-semibold text-slate-700">Mot de passe</label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-900 outline-none transition focus:border-[#526fca] focus:ring-2 focus:ring-[#526fca]/20"
          placeholder="Votre mot de passe"
        />
      </div>

      <label class="flex items-center gap-3 text-sm text-slate-600">
        <input
          type="checkbox"
          name="rememberSession"
          [(ngModel)]="rememberSession"
          class="h-4 w-4 rounded border-slate-300 text-[#243b70] focus:ring-[#526fca]"
        />
        <span>Mémoriser mes identifiants</span>
      </label>

      @if (errorMessage()) {
        <p role="alert" class="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid || isSubmitting()"
        class="w-full rounded-xl bg-[#243b70] px-4 py-3 font-semibold text-white transition hover:bg-[#31578e] disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </section>
</main>
