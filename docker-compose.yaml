services:
  backend:
    build: ./back
    ports:
      - "3001:3001"
    env_file:
      - ./back/.env
    environment:
      FRONTEND_URL: http://localhost:4200
    restart: always

  frontend:
    build: ./front
    ports:
      - "4200:80"
    environment:
      API_URL: http://localhost:3001
    depends_on:
      - backend
    restart: always
