  <h1 id="enfants-title" class="px-8 py-6 text-2xl font-bold text-[#243b70]">
    Tous les enfants
  </h1>

  <div class="max-h-[calc(100vh-12rem)] divide-y divide-slate-100 overflow-y-auto">
    @for (enfant of enfantsSignal(); track enfant.id) {
      <div class="mx-4 my-2 flex items-center gap-5 rounded-xl bg-[#eef3ff] px-6 py-4">
        <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-white text-[#526fca]" aria-hidden="true">
          <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 21c.3-3.8 2.6-6 7-6s6.7 2.2 7 6"></path>
          </svg>
        </span>



        <div class="flex shrink-0 items-center gap-8">
          <div class="min-w-0 flex-1">
            <p class="truncate text-lg font-semibold text-[#243b70]">
              {{ enfant.prenom }}
            </p>
          </div>
          <span>Accéder à mon journal</span>
          <a routerLink="/journal" routerLinkActive="active">
            <button type="button" class="flex h-12 w-12 items-center justify-center rounded-xl bg-white text-[#526fca] transition-colors hover:bg-[#dbe5ff]" aria-label="Voir le calendrier de {{ enfant.prenom }}">
              <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3.5h9.5L19 7v13.5H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z"></path>
                <path d="M15 3.5V7h4M8 10h8M8 13h8M8 16h5"></path>
              </svg>
            </button>
          </a>
          <span>Ajouter des dates de présences</span>
          <a routerLink="/calendrier" routerLinkActive="active">
            <button type="button" class="flex h-12 w-12 items-center justify-center rounded-xl bg-white text-[#526fca] transition-colors hover:bg-[#dbe5ff]" aria-label="Voir le calendrier de {{ enfant.prenom }}">
              <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                <path d="M16 3v4M8 3v4M3 10h18"></path>
              </svg>
            </button>
          </a>
          <span>Ma petite histoire</span>
          <button type="button" (click)="afficherHistoire(enfant)" class="flex h-12 w-12 items-center justify-center rounded-xl bg-white text-[#526fca] transition-colors hover:bg-[#dbe5ff]" aria-label="Voir la petite histoire de {{ enfant.prenom }}">
            <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"></path>
              <path d="M4 5.5V21M8 7h8M8 11h8"></path>
            </svg>
          </button>
        </div>
      </div>
    } @empty {
      <p class="px-8 py-6 text-slate-500">Aucun enfant n'est enregistré.</p>
    }
  </div>

  @if (enfantHistoireSelectionne(); as enfant) {
    <app-modal-petite-histoire [enfant]="enfant" (fermer)="fermerHistoire()" />
  }
