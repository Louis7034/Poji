  <h1 id="enfants-title" class="px-8 py-6 text-2xl font-bold text-[#243b70]">
    Tous les enfants
  </h1>

  <div class="max-h-[calc(100vh-12rem)] overflow-y-auto px-4">
    @for (enfant of enfantsSignal(); track enfant.id) {
      <div class="my-2 grid grid-cols-[16rem_minmax(0,1fr)] items-center gap-3 rounded-xl bg-[#eef3ff] px-5 py-4">
        <div class="flex min-w-0 items-center gap-4">
          <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-white text-[#526fca]" aria-hidden="true">
            <svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="8" r="3.5"></circle>
              <path d="M5 21c.3-3.8 2.6-6 7-6s6.7 2.2 7 6"></path>
            </svg>
          </span>
          <p class="truncate text-lg font-semibold text-[#243b70]">{{ enfant.prenom }}</p>
        </div>

        <div class="grid w-fit grid-cols-4 gap-2 sm:grid-cols-[repeat(4,7rem)]">
          <a [routerLink]="['/journal', enfant.id]" routerLinkActive="active"
            class="flex h-10 items-center justify-center gap-1 rounded-lg bg-white px-2 text-xs font-semibold text-[#526fca] transition-colors hover:bg-[#dbe5ff]"
            [attr.aria-label]="'Accéder au journal de ' + enfant.prenom">
              <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3.5h9.5L19 7v13.5H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z"></path>
                <path d="M15 3.5V7h4M8 10h8M8 13h8M8 16h5"></path>
              </svg>
              <span class="hidden sm:inline">Journal</span>
          </a>
          <a routerLink="/calendrier" routerLinkActive="active"
            class="flex h-10 items-center justify-center gap-1 rounded-lg bg-white px-2 text-xs font-semibold text-[#526fca] transition-colors hover:bg-[#dbe5ff]"
            [attr.aria-label]="'Ajouter des dates de présence pour ' + enfant.prenom">
              <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                <path d="M16 3v4M8 3v4M3 10h18"></path>
              </svg>
              <span class="hidden sm:inline">Calendrier</span>
          </a>
          <button type="button" (click)="afficherHistoire(enfant)"
            class="flex h-10 items-center justify-center gap-1 rounded-lg bg-white px-2 text-xs font-semibold text-[#526fca] transition-colors hover:bg-[#dbe5ff]"
            [attr.aria-label]="'Voir la petite histoire de ' + enfant.prenom">
            <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"></path>
              <path d="M4 5.5V21M8 7h8M8 11h8"></path>
            </svg>
            <span class="hidden sm:inline">Histoire</span>
          </button>
          <button type="button" (click)="afficherAchievements(enfant)"
            class="flex h-10 items-center justify-center gap-1 rounded-lg bg-white px-2 text-xs font-semibold text-[#526fca] transition-colors hover:bg-[#dbe5ff]"
            [attr.aria-label]="'Voir les achievements de ' + enfant.prenom">
            <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"></path>
              <path d="M8 6H5a3 3 0 0 0 3 3M16 6h3a3 3 0 0 1-3 3M12 12v4M8 20h8M9 16h6"></path>
            </svg>
            <span class="hidden sm:inline">Observation</span>
          </button>
        </div>
      </div>
    } @empty {
      <p class="px-8 py-6 text-slate-500">Aucun enfant n'est enregistré.</p>
    }
  </div>

  <div class="px-4 pb-8 pt-4">
    <app-creation-enfant (enfantCree)="ajouterEnfant($event)" />
  </div>

  @if (enfantHistoireSelectionne(); as enfant) {
    <app-modal-petite-histoire [enfant]="enfant" (fermer)="fermerHistoire()" />
  }

  @if (enfantAchievementSelectionne(); as enfant) {
    <app-achievement-list [enfant]="enfant" (fermer)="fermerAchievements()" />
  }
