<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 px-4 py-6"
  role="presentation"
  (click)="fermer.emit()"
>
  <section
    class="w-full max-w-2xl rounded-2xl bg-white p-6 text-[#243b70] shadow-2xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="achievement-title"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-[#526fca]">Achievements</p>
        <h2 id="achievement-title" class="mt-1 text-2xl font-bold">{{ enfant.prenom }}</h2>
      </div>
      <button
        type="button"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-2xl text-slate-500 transition-colors hover:bg-slate-100 hover:text-[#243b70]"
        aria-label="Fermer les achievements"
        (click)="fermer.emit()"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    <div class="mt-6 space-y-3">
      <button type="button" [routerLink]="['/enfant/six-mois']" [queryParams]="{ enfantId: enfant.id }" class="w-full rounded-xl bg-[#eef3ff] px-5 py-4 text-left font-semibold text-[#243b70] transition-colors hover:bg-[#dbe5ff]">
        Grille d'observation à 6 mois
      </button>
      <button type="button" [routerLink]="['/enfant/douze-mois']" [queryParams]="{ enfantId: enfant.id }" class="w-full rounded-xl bg-[#eef3ff] px-5 py-4 text-left font-semibold text-[#243b70] transition-colors hover:bg-[#dbe5ff]">
        Grille d'observation à 12 mois
      </button>
      <button type="button" [routerLink]="['/enfant/dix-huit-mois']" [queryParams]="{ enfantId: enfant.id }" class="w-full rounded-xl bg-[#eef3ff] px-5 py-4 text-left font-semibold text-[#243b70] transition-colors hover:bg-[#dbe5ff]">
        Grille d'observation à 18 mois
      </button>
      <button type="button" [routerLink]="['/enfant/vingt-quatre-mois']" [queryParams]="{ enfantId: enfant.id }" class="w-full rounded-xl bg-[#eef3ff] px-5 py-4 text-left font-semibold text-[#243b70] transition-colors hover:bg-[#dbe5ff]">
        Grille d'observation à 24 mois
      </button>
      <button type="button" [routerLink]="['/enfant/trente-six-mois']" [queryParams]="{ enfantId: enfant.id }" class="w-full rounded-xl bg-[#eef3ff] px-5 py-4 text-left font-semibold text-[#243b70] transition-colors hover:bg-[#dbe5ff]">
        Grille d'observation à 36 mois
      </button>
    </div>
  </section>
</div>
