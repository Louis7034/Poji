<label class="flex cursor-pointer items-center gap-2 text-sm font-medium text-[#243b70]">
  <input
    type="checkbox"
    class="h-4 w-4 accent-[#526fca]"
    [checked]="quitte"
    [disabled]="quitte"
    (change)="quitteChange.emit($any($event.target).checked)"
  />
  <span>Quitté</span>
</label>
