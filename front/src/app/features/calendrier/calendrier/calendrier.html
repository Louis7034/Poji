<div class="p-6 lg:p-8">
  <h1 class="mb-6 text-2xl font-bold text-[#243b70]">Calendrier des présences</h1>

  <div class="grid gap-6 xl:grid-cols-[minmax(320px,0.9fr)_minmax(420px,1.1fr)]">
    <app-calendrier-tableau
      [presences]="presences()"
      [enfants]="enfants()"
      (dateChange)="selectedDate.set($event)"
    />
    <app-calendrier-presence
      [enfants]="enfants()"
      [selectedDate]="selectedDate()"
      [presences]="presences()"
      (presenceChange)="presenceChange($event)"
      (presenceRemoved)="presenceRemoved($event)"
    />
  </div>
</div>
