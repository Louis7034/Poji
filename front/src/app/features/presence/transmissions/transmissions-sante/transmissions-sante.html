@if (sante(); as donnees) {
  <div class="space-y-4">
    <label class="block text-sm font-medium text-slate-600">Symptômes
      <textarea [(ngModel)]="donnees.symptome" (ngModelChange)="sauvegarder('symptome', $event)"
        rows="4" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-slate-700"></textarea>
    </label>
    <label class="block text-sm font-medium text-slate-600">Traitement
      <textarea [(ngModel)]="donnees.traitement" (ngModelChange)="sauvegarder('traitement', $event)"
        rows="4" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-slate-700"></textarea>
    </label>
    <label class="block text-sm font-medium text-slate-600">Observations de santé
      <textarea [(ngModel)]="donnees.observation" (ngModelChange)="sauvegarder('observation', $event)"
        rows="5" class="mt-1 w-full resize-y rounded-lg border border-slate-200 px-3 py-2 text-slate-700"></textarea>
    </label>
    @if (sauvegarde(); as etat) {
      <p class="text-xs text-slate-400" role="status">
        {{ etat === 'en cours' ? 'Enregistrement...' : etat === 'enregistre' ? 'Enregistré' : 'Erreur lors de l’enregistrement' }}
      </p>
    }
  </div>
} @else {
  <p class="rounded-xl bg-slate-50 px-4 py-8 text-center text-slate-500">Aucune donnée de santé.</p>
}

<app-transmission-sante-creation
  [enfantId]="enfantId"
  (created)="ajouter($event)" />
