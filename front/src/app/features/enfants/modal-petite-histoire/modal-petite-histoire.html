<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 px-4 py-6"
  role="presentation"
  (click)="fermer.emit()"
>
  <section
    class="max-h-[85vh] w-full max-w-2xl overflow-y-auto rounded-2xl bg-white p-6 text-[#243b70] shadow-2xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="histoire-title"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-[#526fca]">Ma petite histoire</p>
        <h2 id="histoire-title" class="mt-1 text-2xl font-bold">{{ enfant.prenom }}</h2>
      </div>
      <button
        type="button"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-2xl text-slate-500 transition-colors hover:bg-slate-100 hover:text-[#243b70]"
        aria-label="Fermer la petite histoire"
        (click)="fermer.emit()"
      >
        <span aria-hidden="true">&times;</span>
      </button>
    </div>

    @if (enfant.histoire_enfant.length > 0) {
      <div class="mt-6 space-y-4">
        @for (histoire of enfant.histoire_enfant; track histoire.id) {
          <article class="rounded-xl bg-[#eef3ff] p-4">
            @if (histoire.annee) {
              <p class="text-sm font-semibold text-[#526fca]">{{ histoire.annee }}</p>
            }
            <p class="mt-1 whitespace-pre-line text-base leading-relaxed text-slate-700">
              {{ histoire.histoire || 'Aucune histoire renseignée' }}
            </p>
          </article>
        }
      </div>
    } @else {
      <p class="mt-6 rounded-xl bg-slate-50 p-4 text-slate-500">Aucune histoire renseignée.</p>
    }
  </section>
</div>
